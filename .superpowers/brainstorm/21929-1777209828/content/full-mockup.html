<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mockup: あいさつページ</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Segoe UI', system-ui, sans-serif;
    background: #1a1a2e;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 32px 16px;
  }

  .page-wrapper {
    width: 100%;
    max-width: 520px;
  }

  /* ヘッダー */
  .page-header {
    text-align: center;
    margin-bottom: 28px;
  }
  .page-header h1 {
    font-size: 28px;
    font-weight: 800;
    color: white;
    letter-spacing: -0.5px;
  }
  .page-header p {
    font-size: 14px;
    color: rgba(255,255,255,0.6);
    margin-top: 4px;
  }

  /* フォームカード */
  .form-card {
    background: rgba(255,255,255,0.12);
    backdrop-filter: blur(16px);
    border: 1px solid rgba(255,255,255,0.2);
    border-radius: 20px;
    padding: 24px;
    margin-bottom: 28px;
  }
  .form-card h2 {
    font-size: 14px;
    font-weight: 700;
    color: rgba(255,255,255,0.8);
    text-transform: uppercase;
    letter-spacing: 1px;
    margin-bottom: 16px;
  }
  .field {
    margin-bottom: 14px;
  }
  .field label {
    display: block;
    font-size: 12px;
    color: rgba(255,255,255,0.6);
    margin-bottom: 6px;
    font-weight: 600;
  }
  .field .mock-input {
    width: 100%;
    background: rgba(255,255,255,0.1);
    border: 1px solid rgba(255,255,255,0.2);
    border-radius: 10px;
    padding: 10px 14px;
    color: rgba(255,255,255,0.5);
    font-size: 13px;
    font-style: italic;
  }
  .submit-btn {
    width: 100%;
    background: white;
    color: #5b21b6;
    border: none;
    border-radius: 12px;
    padding: 12px;
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
    margin-top: 4px;
    letter-spacing: 0.3px;
  }

  /* 区切り */
  .divider {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 20px;
  }
  .divider-line { flex: 1; height: 1px; background: rgba(255,255,255,0.15); }
  .divider-text { font-size: 12px; color: rgba(255,255,255,0.4); font-weight: 600; }

  /* チャットリスト */
  .chat-list {
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .chat-item {
    display: flex;
    align-items: flex-start;
    gap: 10px;
  }
  .avatar {
    width: 36px;
    height: 36px;
    border-radius: 50%;
    background: rgba(255,255,255,0.25);
    border: 2px solid rgba(255,255,255,0.3);
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 13px;
    font-weight: 700;
    color: white;
  }
  .bubble {
    background: rgba(255,255,255,0.15);
    border: 1px solid rgba(255,255,255,0.2);
    border-radius: 4px 16px 16px 16px;
    padding: 10px 14px;
    flex: 1;
  }
  .bubble .name {
    font-size: 12px;
    font-weight: 700;
    color: rgba(255,255,255,0.9);
    margin-bottom: 3px;
  }
  .bubble .message {
    font-size: 14px;
    color: white;
    line-height: 1.4;
  }
  .empty-state {
    text-align: center;
    padding: 32px;
    color: rgba(255,255,255,0.4);
    font-size: 14px;
    background: rgba(255,255,255,0.06);
    border-radius: 16px;
    border: 1px dashed rgba(255,255,255,0.15);
  }

  /* 背景グラデーション */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    z-index: -1;
  }

  .label-note {
    font-size: 11px;
    color: rgba(255,255,255,0.35);
    text-align: center;
    margin-top: 24px;
  }
</style>
</head>
<body>
  <div class="page-wrapper">
    <div class="page-header">
      <h1>✉️ あいさつページ</h1>
      <p>みんなで一言あいさつしよう</p>
    </div>

    <div class="form-card">
      <h2>あいさつを送る</h2>
      <div class="field">
        <label>名前</label>
        <div class="mock-input">名前を入力...</div>
      </div>
      <div class="field">
        <label>メッセージ</label>
        <div class="mock-input">あいさつを入力...</div>
      </div>
      <button class="submit-btn">✉ 送信する</button>
    </div>

    <div class="divider">
      <div class="divider-line"></div>
      <div class="divider-text">あいさつ一覧</div>
      <div class="divider-line"></div>
    </div>

    <div class="chat-list">
      <div class="chat-item">
        <div class="avatar">田</div>
        <div class="bubble">
          <div class="name">田中さん</div>
          <div class="message">こんにちは！よろしくお願いします 😊</div>
        </div>
      </div>
      <div class="chat-item">
        <div class="avatar">山</div>
        <div class="bubble">
          <div class="name">山田さん</div>
          <div class="message">はじめまして、山田です！</div>
        </div>
      </div>
      <div class="chat-item">
        <div class="avatar">鈴</div>
        <div class="bubble">
          <div class="name">鈴木さん</div>
          <div class="message">よろしくです〜</div>
        </div>
      </div>
    </div>

    <p class="label-note">※ これはデザインモックアップです</p>
  </div>
</body>
</html>
