<h2>どのデザインスタイルが好みですか？</h2>
<p class="subtitle">あいさつページの全体的な雰囲気を選んでください</p>

<div class="cards">
  <div class="card" data-choice="clean" onclick="toggleSelect(this)">
    <div class="card-image" style="background:#f8fafc;padding:20px;border-bottom:1px solid #e2e8f0">
      <div style="background:white;border-radius:12px;padding:20px;box-shadow:0 2px 8px rgba(0,0,0,0.08)">
        <div style="font-size:18px;font-weight:700;color:#1e293b;margin-bottom:16px">あいさつページ</div>
        <div style="background:#f1f5f9;border-radius:8px;padding:12px;margin-bottom:8px">
          <div style="font-size:11px;color:#64748b;margin-bottom:4px">名前</div>
          <div style="height:10px;background:#e2e8f0;border-radius:4px;width:60%"></div>
        </div>
        <div style="background:#f1f5f9;border-radius:8px;padding:12px;margin-bottom:12px">
          <div style="font-size:11px;color:#64748b;margin-bottom:4px">メッセージ</div>
          <div style="height:10px;background:#e2e8f0;border-radius:4px;width:80%"></div>
        </div>
        <div style="background:#3b82f6;color:white;border-radius:8px;padding:8px 16px;text-align:center;font-size:12px;font-weight:600">送信する</div>
      </div>
    </div>
    <div class="card-body">
      <h3>A. クリーン &amp; モダン</h3>
      <p>白を基調にしたシンプルなカードデザイン。青いアクセントカラーで清潔感がある。</p>
    </div>
  </div>

  <div class="card" data-choice="gradient" onclick="toggleSelect(this)">
    <div class="card-image" style="background:linear-gradient(135deg,#667eea,#764ba2);padding:20px;border-bottom:1px solid #e2e8f0">
      <div style="background:rgba(255,255,255,0.15);border-radius:12px;padding:20px;backdrop-filter:blur(10px)">
        <div style="font-size:18px;font-weight:700;color:white;margin-bottom:16px">あいさつページ ✉️</div>
        <div style="background:rgba(255,255,255,0.2);border-radius:8px;padding:12px;margin-bottom:8px">
          <div style="font-size:11px;color:rgba(255,255,255,0.8);margin-bottom:4px">名前</div>
          <div style="height:10px;background:rgba(255,255,255,0.3);border-radius:4px;width:60%"></div>
        </div>
        <div style="background:rgba(255,255,255,0.2);border-radius:8px;padding:12px;margin-bottom:12px">
          <div style="font-size:11px;color:rgba(255,255,255,0.8);margin-bottom:4px">メッセージ</div>
          <div style="height:10px;background:rgba(255,255,255,0.3);border-radius:4px;width:80%"></div>
        </div>
        <div style="background:white;color:#764ba2;border-radius:8px;padding:8px 16px;text-align:center;font-size:12px;font-weight:700">送信する</div>
      </div>
    </div>
    <div class="card-body">
      <h3>B. グラデーション</h3>
      <p>紫〜青のグラデーション背景にガラス風カード。華やかで目を引くデザイン。</p>
    </div>
  </div>

  <div class="card" data-choice="warm" onclick="toggleSelect(this)">
    <div class="card-image" style="background:#fffbf0;padding:20px;border-bottom:1px solid #e2e8f0">
      <div style="background:white;border-radius:12px;padding:20px;border:1px solid #fde68a;box-shadow:0 4px 12px rgba(251,191,36,0.15)">
        <div style="font-size:18px;font-weight:700;color:#92400e;margin-bottom:4px">あいさつページ</div>
        <div style="font-size:10px;color:#d97706;margin-bottom:14px">みんなで一言！</div>
        <div style="border:1.5px solid #fde68a;border-radius:8px;padding:10px;margin-bottom:8px">
          <div style="font-size:11px;color:#92400e;margin-bottom:4px">名前</div>
          <div style="height:10px;background:#fef3c7;border-radius:4px;width:60%"></div>
        </div>
        <div style="border:1.5px solid #fde68a;border-radius:8px;padding:10px;margin-bottom:12px">
          <div style="font-size:11px;color:#92400e;margin-bottom:4px">メッセージ</div>
          <div style="height:10px;background:#fef3c7;border-radius:4px;width:80%"></div>
        </div>
        <div style="background:#f59e0b;color:white;border-radius:8px;padding:8px 16px;text-align:center;font-size:12px;font-weight:700">送信する ✉</div>
      </div>
    </div>
    <div class="card-body">
      <h3>C. ウォーム &amp; フレンドリー</h3>
      <p>黄色・オレンジ系の暖かみのあるデザイン。親しみやすくカジュアルな雰囲気。</p>
    </div>
  </div>
</div>
